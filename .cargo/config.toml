[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
rustflags = [
    "-C", "target-feature=+crt-static",
    "-L", "native=D:/tools/xwin-crt/crt/lib/x64",
    "-L", "native=D:/tools/xwin-crt/sdk/lib/um/x64",
    "-L", "native=D:/tools/xwin-crt/sdk/lib/ucrt/x64",
]

[build]
rustflags = [
    "-C", "linker=rust-lld",
    "-C", "target-feature=+crt-static",
    "-L", "native=D:/tools/xwin-crt/crt/lib/x64",
    "-L", "native=D:/tools/xwin-crt/sdk/lib/um/x64",
    "-L", "native=D:/tools/xwin-crt/sdk/lib/ucrt/x64",
]
